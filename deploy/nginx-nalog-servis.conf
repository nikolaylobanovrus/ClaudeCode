# nginx для налог-сервис.рф на VPS. Сайт статический, бэкенда нет (оплата и
# распознавание живут в Supabase edge functions). С 28.09.2026 каждая страница
# лежит на диске отдельным файлом — её собирает пререндер (scripts/prerender.mjs),
# чтобы поисковику доставался текст, а не пустой <div id="root">.
#
# Установка:
#   sudo cp deploy/nginx-nalog-servis.conf /etc/nginx/sites-available/nalog-servis
#   sudo ln -sf /etc/nginx/sites-available/nalog-servis /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS выпускается отдельно (certbot --nginx), он сам допишет 443-й блок.
# Домен кириллический — в конфиге пишем punycode, nginx с ним и работает.

server {
    listen 80;
    listen [::]:80;
    server_name xn----7sbhcltqolxje.xn--p1ai www.xn----7sbhcltqolxje.xn--p1ai;

    # На сервере уже есть default_server соседнего проекта (проксирует всё на
    # :8000). Конфликта нет: nginx сначала ищет совпадение по server_name и
    # только потом уходит в default. Но порядок важен — сперва этот конфиг,
    # потом переключение A-записей, иначе посетители увидят чужой сайт.

    root /var/www/nalog-servis;
    index index.html;

    # HTML кэшировать нельзя: иначе после выкладки человек часами видит
    # ПРЕДЫДУЩУЮ сборку. Заголовок стоит на уровне server, а не на
    # «location = /index.html»: люди открывают «/» и «/deklaraciya/anketa»,
    # а под точное совпадение «/index.html» такие запросы не попадают. На
    # боевом 15.10.2026 это и было видно — страницы уезжали вообще без
    # Cache-Control, и браузер кэшировал их «на своё усмотрение».
    #
    # В /assets/ свой add_header с immutable, и он этот заголовок перекрывает:
    # в nginx набор add_header из location ЗАМЕНЯЕТ унаследованный, а не
    # дополняет. Именно поэтому строчка здесь ничего не ломает в ассетах.
    add_header Cache-Control "no-cache, must-revalidate" always;

    # Файлы из assets/ содержат хеш в имени — можно кэшировать вечно.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Служебные файлы: свой add_header нужен, чтобы перекрыть immutable, если
    # когда-нибудь попадут под другое правило. Заодно напоминание, что их
    # кэшировать тоже нельзя.
    location ~* ^/(robots\.txt|sitemap\.xml|llms\.txt|favicon\.svg|og-image\.svg)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Каждая страница лежит в dist отдельным файлом (<путь>/index.html), и
    # отдавать её надо НАПРЯМУЮ, а не через «$uri/».
    #
    # «$uri/» — это проверка «существует ли каталог», и nginx на ней сначала
    # шлёт 301 на адрес со слешем на конце. Получалось два вреда сразу:
    #   - canonical и sitemap.xml у нас без слеша, а сервер уводил на адрес со
    #     слешем: поисковик видит редирект туда, где canonical зовёт обратно;
    #   - каталог БЕЗ index.html (например deklaraciya/, в нём только anketa,
    #     instrukciya и калькулятор) отдавал 403 Forbidden вместо сайта.
    # Оба случая поймались на боевом 28.09.2026 в день перехода на чистые URL.
    #
    # Последнее звено — честный 404, а не подмена главной (этап C, 15.10.2026).
    #
    # Раньше любой несуществующий адрес отдавал index.html с кодом 200, и
    # роутер показывал «страница не найдена». Для человека разницы нет, а для
    # поисковика есть: он видит 200 и бесконечное число «страниц» с одним и
    # тем же содержимым — мусор в индексе и размытый краулинговый бюджет.
    #
    # Почему это безопасно: в приложении НЕТ маршрутов с параметрами (см.
    # src/App.jsx — все пути литеральные), и каждый из них лежит на диске
    # отдельным файлом после пререндера. Соответствие списков проверяется
    # перед каждой выкладкой (check-routes, check-prerender), так что живой
    # адрес под =404 попасть не может.
    location / {
        try_files $uri $uri/index.html =404;
    }
    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml text/xml;

    # Заголовки безопасности. CSP не ставим: на странице живут Метрика,
    # пиксель VK и виджеты, готовый список источников тут только сломает.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/nalog-servis.access.log;
    error_log  /var/log/nginx/nalog-servis.error.log;
}
