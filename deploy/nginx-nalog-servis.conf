# nginx для налог-сервис.рф на VPS. Сайт статический, бэкенда нет (оплата и
# распознавание живут в Supabase edge functions). С 28.09.2026 каждая страница
# лежит на диске отдельным файлом — её собирает пререндер (scripts/prerender.mjs),
# чтобы поисковику доставался текст, а не пустой <div id="root">.
#
# Установка:
#   sudo cp deploy/nginx-nalog-servis.conf /etc/nginx/sites-available/nalog-servis
#   sudo ln -sf /etc/nginx/sites-available/nalog-servis /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS выпускается отдельно (certbot --nginx), он сам допишет 443-й блок.
# Домен кириллический — в конфиге пишем punycode, nginx с ним и работает.

server {
    listen 80;
    listen [::]:80;
    server_name xn----7sbhcltqolxje.xn--p1ai www.xn----7sbhcltqolxje.xn--p1ai;

    # На сервере уже есть default_server соседнего проекта (проксирует всё на
    # :8000). Конфликта нет: nginx сначала ищет совпадение по server_name и
    # только потом уходит в default. Но порядок важен — сперва этот конфиг,
    # потом переключение A-записей, иначе посетители увидят чужой сайт.

    root /var/www/nalog-servis;
    index index.html;

    # Файлы из assets/ содержат хеш в имени — можно кэшировать вечно.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html и служебные файлы кэшировать нельзя: иначе после выкладки
    # люди сутками видят старую сборку.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location ~* ^/(robots\.txt|sitemap\.xml|llms\.txt|favicon\.svg|og-image\.svg)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Каждая страница лежит в dist отдельным файлом (<путь>/index.html), и
    # отдавать её надо НАПРЯМУЮ, а не через «$uri/».
    #
    # «$uri/» — это проверка «существует ли каталог», и nginx на ней сначала
    # шлёт 301 на адрес со слешем на конце. Получалось два вреда сразу:
    #   - canonical и sitemap.xml у нас без слеша, а сервер уводил на адрес со
    #     слешем: поисковик видит редирект туда, где canonical зовёт обратно;
    #   - каталог БЕЗ index.html (например deklaraciya/, в нём только anketa,
    #     instrukciya и калькулятор) отдавал 403 Forbidden вместо сайта.
    # Оба случая поймались на боевом 28.09.2026 в день перехода на чистые URL.
    #
    # Последним звеном остаётся /index.html: пока это SPA-фолбэк, на этапе C
    # он сменится на honest 404 (error_page 404 /404.html).
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml text/xml;

    # Заголовки безопасности. CSP не ставим: на странице живут Метрика,
    # пиксель VK и виджеты, готовый список источников тут только сломает.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/nalog-servis.access.log;
    error_log  /var/log/nginx/nalog-servis.error.log;
}
