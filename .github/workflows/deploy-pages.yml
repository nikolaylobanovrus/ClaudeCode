name: Deploy site to GitHub Pages

on:
  push:
    branches: [claude/react-website-wi5fnz]
  workflow_dispatch:

# Официальный метод GitHub Pages (артефакт + deploy-pages) — надёжнее,
# без периодических сбоев внутренней сборки, как было при публикации
# в ветку gh-pages. Требует Settings → Pages → Source = «GitHub Actions».
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (GitHub Pages configuration)
        run: npm run build
        env:
          VITE_BASE: "./"
          VITE_HASH_ROUTER: "1"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
