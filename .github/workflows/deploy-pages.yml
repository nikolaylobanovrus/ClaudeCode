name: Deploy site to GitHub Pages

on:
  push:
    branches: [claude/react-website-wi5fnz]
  workflow_dispatch:

# Публикуем собранный сайт в ветку gh-pages (пуш в ветку токену Actions
# разрешён, в отличие от создания Pages-сайта через REST API).
permissions:
  contents: write

concurrency:
  group: pages-branch
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (GitHub Pages configuration)
        run: npm run build
        env:
          VITE_BASE: "./"
          VITE_HASH_ROUTER: "1"

      # force_orphan убран: force-push ветки провоцировал сбои внутренней
      # сборки GitHub Pages (история коммитов деплоя теперь сохраняется).
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
