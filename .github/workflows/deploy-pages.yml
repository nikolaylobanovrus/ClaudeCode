name: Deploy site to GitHub Pages

on:
  push:
    branches: [claude/react-website-wi5fnz]
  workflow_dispatch:

# Официальный метод GitHub Pages (артефакт + deploy-pages) — надёжнее,
# без периодических сбоев внутренней сборки, как было при публикации
# в ветку gh-pages. Требует Settings → Pages → Source = «GitHub Actions».
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (GitHub Pages configuration)
        run: npm run build
        env:
          VITE_BASE: "./"
          VITE_HASH_ROUTER: "1"
          # Боевая оплата ЮKassa (Supabase Edge Functions задеплоены,
          # секреты заданы) — см. docs/yookassa-setup.md.
          VITE_PAY_PROVIDER: "yookassa"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url || steps.d3.outputs.page_url }}
    steps:
      # GitHub Pages иногда возвращает транзиентную ошибку
      # «Deployment failed, try again later» на финальном шаге.
      # Делаем до 3 попыток: первые две мягкие, третья — решающая.
      - name: Deploy — попытка 1
        id: d1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Пауза перед попыткой 2
        if: steps.d1.outcome == 'failure'
        run: sleep 20

      - name: Deploy — попытка 2
        id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Пауза перед попыткой 3
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        run: sleep 30

      - name: Deploy — попытка 3 (финальная)
        id: d3
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v4
