<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Кнопки</title><style>
  body{font:15px/1.5 system-ui,sans-serif; color:#1B1D22; background:#F6F5F2; margin:0; padding:24px}
  .row{display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin-bottom:18px}
  .label{font:11px ui-monospace,monospace; color:#6A6D74; width:110px}
  .btn{display:inline-block; padding:12px 22px; border-radius:999px; text-decoration:none;
    font-weight:650; font-size:15px; border:1.5px solid transparent; cursor:pointer}
  .btn-primary{background:#1B1D22; color:#fff}
  .btn-primary:hover{background:#000}
  .btn-ghost{border-color:#E4E1DA; color:#1B1D22; background:#fff}
  .btn-ghost:hover{border-color:#1B1D22}
  .btn-light{background:#fff; color:#1B1D22}
  .btn-sm{padding:9px 18px; font-size:14px}
  .dark{background:#232528; padding:16px; border-radius:12px}
</style></head><body>
<div class="row"><span class="label">primary</span><a class="btn btn-primary" href="#">Создать портреты</a><a class="btn btn-primary btn-sm" href="#">В шапке</a></div>
<div class="row"><span class="label">ghost</span><a class="btn btn-ghost" href="#">Посмотреть образы</a><a class="btn btn-ghost btn-sm" href="#">Выбрать Стандарт</a></div>
<div class="row"><span class="label">на тёмном</span><span class="dark"><a class="btn btn-light" href="#">Обсудить для команды</a></span></div>
<p style="color:#6A6D74; font-size:13.5px; max-width:60ch">Пилюльная форма (999px). Основная — чернильная, не акцентная: латунь
зарезервирована под мелкие маркеры и цену, чтобы не конкурировать с CTA.</p>
</body></html>
